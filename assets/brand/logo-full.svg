<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 68" width="268" height="68">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;display=swap');</style>
    <radialGradient id="icon-glow" cx="50%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#00C4B4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4C2"/>
      <stop offset="100%" stop-color="#00A89A"/>
    </linearGradient>
  </defs>
  <!-- Icon square -->
  <rect width="68" height="68" rx="14" fill="#0B1120"/>
  <rect width="68" height="68" rx="14" fill="url(#icon-glow)"/>
  <!-- V mark -->
  <path d="M18 18 L34 50 L50 18"
        stroke="url(#v-grad)"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>
  <!-- Wordmark -->
  <text x="84" y="45"
        font-family="'Bricolage Grotesque', 'Arial Black', sans-serif"
        font-size="28"
        font-weight="800"
        letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Visa</tspan><tspan fill="#00C4B4">Runner</tspan>
  </text>
</svg>
